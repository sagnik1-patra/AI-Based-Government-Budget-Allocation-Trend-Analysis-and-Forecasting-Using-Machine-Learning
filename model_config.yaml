project_name: AI-Based Government Budget Allocation Trend Analysis and Forecasting
dataset: RS_Session_252_AU_600.csv
target_column: Budget_Allocation
feature_columns:
- Year
models:
  linear_regression:
    algorithm: LinearRegression
    scaling: StandardScaler
  ann:
    algorithm: Artificial Neural Network
    hidden_layers:
    - 32
    - 16
    - 8
    activation: relu
    optimizer: Adam
    learning_rate: 0.001
    epochs: 300
    batch_size: 1
forecast:
  future_years: 6
evaluation:
  metrics:
  - MAE
  - MSE
  - RMSE
  - R2_Score
  type: in_sample_training
